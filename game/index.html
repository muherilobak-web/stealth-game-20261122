<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Gloaming Archive — a stealth game</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0a08;
    color: #e8e0cc;
    font-family: Georgia, serif;
  }
  #wrap {
    width: 1280px;
    margin: 0 auto;
    padding-top: 12px;
  }
  #game {
    display: block;
    width: 1280px;
    height: 720px;
    background: #241b12;
    border: 1px solid #3a2c1a;
  }
  #hud {
    display: flex;
    align-items: center;
    gap: 18px;
    height: 34px;
    padding: 0 10px;
    background: #14100a;
    border: 1px solid #3a2c1a;
    border-top: none;
    font-family: sans-serif;
    font-size: 14px;
  }
  #hud-level { font-weight: bold; color: #f3e6c2; }
  #hud-goal { color: #9fb2d8; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hud-eye { display: flex; align-items: center; gap: 6px; }
  #hud-eye-bar {
    width: 110px;
    height: 10px;
    background: #2a2118;
    border: 1px solid #5a4630;
  }
  #hud-eye-fill {
    height: 100%;
    width: 0%;
    background: #f5c65a;
  }
  #hud p { margin: 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hud">
    <span id="hud-level">The Reading Room</span>
    <span id="hud-pages">0 / 1 pages</span>
    <span id="hud-coins">Coins: 3</span>
    <span id="hud-eye">Suspicion <span id="hud-eye-bar"><span id="hud-eye-fill"></span></span></span>
    <span id="hud-time">00:00</span>
    <span id="hud-goal"></span>
  </div>
</div>
<script src="src/config.js"></script>
<script src="src/levels.js"></script>
<script src="src/visibility.js"></script>
<script src="src/guards.js"></script>
<script src="src/player.js"></script>
<script src="src/audio.js"></script>
<script src="src/input.js"></script>
<script src="src/render.js"></script>
<script src="src/main.js"></script>
</body>
</html>
